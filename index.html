<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To do list</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%234f5bd5%22/%3E%3Cpath d=%22M9 16.5l4.5 4.5L23 11.5%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --soft: #f1f3f6; --line: #e6e8ec; --text: #171a21; --sub: #6b7280; --faint: #9aa1ad;
    --accent: #4f5bd5; --accent-soft: #eef0fc; --on-accent: #fff;
    --red: #d1453b; --red-soft: #fdeeed; --amber: #b7791f; --amber-soft: #fdf5e6; --green: #23915a; --green-soft: #e8f6ee;
    --r: 14px; --shadow: 0 1px 2px rgba(17, 24, 39, .04), 0 4px 16px rgba(17, 24, 39, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #171a20; --soft: #1e222a; --line: #282d36; --text: #eceef2; --sub: #9aa2b1; --faint: #6b7380;
      --accent: #8b95f0; --accent-soft: #23284a; --on-accent: #10121a;
      --red: #f0827a; --red-soft: #3a1f1d; --amber: #e5b05a; --amber-soft: #352a14; --green: #5fcf92; --green-soft: #173123;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    font: 14.5px/1.55 "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 64px; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
  .logo i { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); font-style: normal; font-size: 15px; }
  .llm { display: inline-flex; align-items: center; gap: 6px; border: none; background: none; color: var(--sub); font-size: 12.5px; cursor: pointer; padding: 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .dot.ok { background: var(--green); } .dot.bad { background: var(--red); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
  .bar-top { display: grid; grid-template-columns: auto 1fr 160px 84px auto; gap: 8px; align-items: center; padding: 10px; transition: border-color .15s, background .15s; }
  .bar-top.over { border-color: var(--accent); background: var(--accent-soft); }
  .field { height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 12px; min-width: 0; }
  .btn { height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 14px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; padding: 0 20px; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .up-status { color: var(--sub); font-size: 13px; padding: 0 4px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .up-status b { color: var(--text); font-weight: 650; }
  .link { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; font-size: inherit; }
  .link:hover { text-decoration: underline; }
  .progress { height: 3px; border-radius: 3px; background: var(--soft); overflow: hidden; margin: 8px 4px 0; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .note { font-size: 12.5px; color: var(--sub); margin: 8px 6px 0; }
  .note:empty { display: none; }
  .err { color: var(--red); white-space: pre-wrap; }
  @media (max-width: 720px) {
    .bar-top { grid-template-columns: auto 1fr; }
    #me { grid-column: 1 / -1; }
    #weeks { width: 84px; }
  }

  .seg { display: inline-flex; gap: 2px; background: var(--soft); border-radius: 11px; padding: 3px; margin: 22px 0 12px; }
  .seg button { border: none; background: none; border-radius: 8px; padding: 7px 16px; cursor: pointer; color: var(--sub); font-weight: 600; font-size: 13.5px; }
  .seg button[aria-selected=true] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }

  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
  .tiles.six { grid-template-columns: repeat(6, 1fr); }
  @media (max-width: 720px) { .tiles, .tiles.six { grid-template-columns: repeat(3, 1fr); } }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; transition: border-color .15s, background .15s; }
  .tile:hover { border-color: var(--faint); }
  .tile .k { font-size: 12.5px; color: var(--sub); font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
  .tile .k small { color: var(--faint); font-weight: 500; white-space: nowrap; }
  .tile .v { font-size: 24px; font-weight: 750; letter-spacing: -.02em; margin-top: 2px; }
  .tile.red .v { color: var(--red); } .tile.zero .v { color: var(--faint); }
  .tile[aria-selected=true] { border-color: var(--accent); background: var(--accent-soft); }
  .tile[aria-selected=true] .k { color: var(--accent); }

  .panel { padding: 6px 18px 14px; }
  .sum { background: var(--soft); border-radius: 12px; padding: 14px 16px; margin: 12px 0 6px; }
  .sum-h { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
  .sum-h .tabs { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
  .sum-h .tabs button { border: none; background: none; padding: 3px 9px; border-radius: 7px; font-size: 12.5px; font-weight: 650; color: var(--sub); cursor: pointer; }
  .sum-h .tabs button[aria-selected=true] { background: var(--surface); color: var(--text); }
  .sum-h .ttl { flex: 1; font-size: 12.5px; font-weight: 700; color: var(--sub); }
  .icon { border: none; background: none; color: var(--sub); cursor: pointer; border-radius: 7px; padding: 3px 8px; font-size: 12.5px; }
  .icon:hover { background: var(--surface); color: var(--text); }
  .sum p { margin: 2px 0 8px; font-size: 14px; line-height: 1.6; }
  .sum ul { list-style: none; margin: 0; padding: 0; }
  .sum li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; font-size: 13.5px; }
  .sum li .src { margin-left: auto; padding-left: 8px; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--faint); font-size: 13px; padding: 4px 0; }

  .badge { flex: none; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; line-height: 1.5; white-space: nowrap; }
  .b-red { background: var(--red-soft); color: var(--red); } .b-amber { background: var(--amber-soft); color: var(--amber); }
  .b-green { background: var(--green-soft); color: var(--green); } .b-gray { background: var(--surface); color: var(--sub); }
  .b-blue { background: var(--accent-soft); color: var(--accent); }
  .kd { display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 0 4px; margin-right: 4px; vertical-align: 1px; color: #fff; }
  .kd.docx { background: #2b579a; } .kd.xlsx { background: #217346; }

  .grp { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 700; color: var(--sub); letter-spacing: .02em; margin: 18px 0 2px; }
  .grp .c { color: var(--faint); font-weight: 600; }
  .grp .r { margin-left: auto; color: var(--faint); font-weight: 500; }
  .row { display: flex; gap: 10px; align-items: center; padding: 9px 2px; border-top: 1px solid var(--line); }
  .grp + .row { border-top: none; }
  .row input { width: 16px; height: 16px; accent-color: var(--accent); flex: none; margin: 0; }
  .pd { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .pd.high { background: var(--red); } .pd.medium { background: var(--amber); } .pd.low { background: var(--faint); opacity: .5; }
  .main { flex: 1; min-width: 0; }
  .tt { font-weight: 600; }
  .row.done .tt { color: var(--faint); text-decoration: line-through; }
  .meta { font-size: 12.5px; color: var(--faint); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .link { color: var(--sub); }
  .when { flex: none; font-size: 12.5px; color: var(--sub); font-weight: 600; }
  .when.late { color: var(--red); }
  details.more { margin-top: 12px; }
  details.more summary { cursor: pointer; font-size: 12.5px; color: var(--sub); list-style: none; }
  details.more summary::before { content: "▸ "; } details.more[open] summary::before { content: "▾ "; }

  .mails { margin-top: 14px; padding: 4px 18px; }
  .mails > summary { cursor: pointer; padding: 12px 0; font-weight: 700; font-size: 13.5px; list-style: none; display: flex; gap: 6px; }
  .mails > summary::after { content: "▾"; margin-left: auto; color: var(--faint); transition: transform .15s; }
  .mails:not([open]) > summary::after { transform: rotate(-90deg); }
  .mtools { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .mtools .field { flex: 1; }
  .mtools label { font-size: 12.5px; color: var(--sub); white-space: nowrap; display: flex; gap: 4px; align-items: center; }
  .mrow .link { color: var(--text); font-weight: 600; }
  .mrow { display: grid; grid-template-columns: 66px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .mrow .d { color: var(--faint); font-size: 12.5px; }
  .mrow .s { font-size: 13px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kw { border: none; background: none; color: var(--accent); font-size: 12px; padding: 0 6px 0 0; cursor: pointer; }
  .skip { margin-top: 10px; padding: 0 16px; border-color: var(--amber-soft); }
  .skip > summary { cursor: pointer; padding: 10px 0; font-size: 13px; font-weight: 650; color: var(--amber); list-style: none; display: flex; gap: 6px; align-items: center; }
  .skip > summary::after { content: "▾"; margin-left: auto; color: var(--faint); }
  .skip:not([open]) > summary::after { content: "▸"; }
  .skip .srow { display: flex; gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .skip .srow .nm { flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .skip .srow .why { color: var(--sub); min-width: 0; }
  .foot { text-align: center; color: var(--faint); font-size: 12px; margin-top: 18px; }
  .foot .link { color: var(--faint); text-decoration: underline; }

  dialog { width: min(780px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--line);
    border-radius: var(--r); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0, 0, 0, .2); }
  dialog::backdrop { background: rgba(10, 12, 18, .4); }
  .dv { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
  .dv-h { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
  .dv-h h3 { margin: 0; font-size: 16px; padding-right: 30px; word-break: break-word; }
  .dv-meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12.5px; margin: 8px 0 0; }
  .dv-meta dt { color: var(--faint); } .dv-meta dd { margin: 0; color: var(--sub); word-break: break-all; }
  .dv-b { padding: 16px 20px 20px; overflow: auto; white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.7; }
  .close { position: absolute; top: 12px; right: 12px; border: none; background: none; font-size: 20px; color: var(--sub); cursor: pointer; }
</style>
</head>
<body>
<div id="old" style="display:none;margin:16px;padding:14px;border:2px solid #d1453b;border-radius:10px;background:#fdeeed;color:#171a21">
  이 브라우저에서는 동작하지 않습니다. <b>Chrome</b> 또는 <b>Edge</b>에서 아래 주소를 열어 주세요.<br><code id="oldUrl"></code>
</div>
<script>
  (function () { // ES5: 오래된 브라우저에서도 안내가 보이도록
    var ok = false;
    try { ok = !!(window.fetch && window.Promise && typeof HTMLDialogElement === "function" && new Function("return (() => `${1}`)()")() === "1"); } catch (e) {}
    if (!ok) { document.getElementById("old").style.display = "block"; document.getElementById("oldUrl").appendChild(document.createTextNode(location.href)); }
  })();
</script>

<div class="wrap">
  <header>
    <h1 class="logo"><i>✓</i>To do list</h1>
    <button class="llm" id="llm" type="button" title="LLM 연결 확인"><span class="dot" id="llmDot"></span><span id="llmText">LLM</span></button>
  </header>

  <div class="card bar-top" id="drop">
    <button class="btn" id="pickFiles" type="button" title=".eml 메일 · .docx Word · .xlsx Excel">📎 메일·문서</button>
    <span class="up-status" id="upText">끌어다 놓아도 됩니다</span>
    <input class="field" type="text" id="me" placeholder="내 이름 / 메일" autocomplete="off" aria-label="내 이름 또는 메일">
    <select class="field" id="weeks" aria-label="최근 메일 범위" title="기한 기준 탭에 쓸 최근 메일 범위">
      <option value="1">1주</option><option value="2">2주</option><option value="4" selected>4주</option>
      <option value="8">8주</option><option value="26">6개월</option><option value="52">1년</option><option value="104">2년</option>
      <option value="156">3년</option><option value="260">5년</option><option value="0">전체</option>
    </select>
    <button class="btn primary" id="run" type="button" disabled>분석</button>
  </div>
  <input type="file" id="fileIn" accept=".eml,.docx,.docm,.xlsx,.xlsm,.doc,.xls" multiple hidden>
  <div class="progress hidden" id="runBar"><i></i></div>
  <div class="note" id="log"></div>
  <div class="note err" id="err"></div>
  <details class="card skip hidden" id="skipBox"><summary>⚠ 분석 안 된 파일 <span class="num" id="skipN"></span></summary><div id="skipList" style="padding-bottom:6px"></div></details>

  <div id="result" class="hidden">
    <div class="seg" id="views" role="tablist"></div>
    <div class="tiles" id="tiles"></div>
    <section class="card panel" id="tasks"></section>
    <details class="card mails" id="mailBox">
      <summary>메일·문서 <span class="num" id="mcount" style="color:var(--faint);font-weight:600"></span></summary>
      <div class="mtools">
        <input class="field" type="search" id="q" placeholder="검색" aria-label="메일 검색">
        <label><input type="checkbox" id="onlyAct"> 할 일만</label>
      </div>
      <div id="mails"></div>
      <div style="text-align:center;margin:8px 0 12px"><button class="btn hidden" id="more" type="button">더 보기</button></div>
    </details>
    <p class="foot">LLM 해석 결과입니다 · 원문으로 확인하세요 · <button class="link" id="clearCache" type="button">저장된 분석 지우기</button></p>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dvTitle">
  <div class="dv">
    <button class="close" id="dlgClose" type="button" aria-label="닫기">×</button>
    <div class="dv-h"><h3 id="dvTitle"></h3><dl class="dv-meta" id="dvMeta"></dl></div>
    <div class="dv-b" id="dvBody"></div>
  </div>
</dialog>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const WD = "월화수목금토일";
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) k === "text" ? (n.textContent = v) : k === "class" ? (n.className = v) : n.setAttribute(k, v);
    n.append(...kids.filter((k) => k != null && k !== false));
    return n;
  };
  const put = (n, ...kids) => (n.append(...kids.filter((k) => k != null && k !== false)), n);
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
  async function api(method, url, body, headers = {}) {
    const res = await fetch(url, { method, body, headers });
    let data = {}; try { data = await res.json(); } catch {}
    if (!res.ok) throw new Error(data.error || `요청 실패 (${res.status})`);
    return data;
  }
  const day = (iso) => new Date(iso.slice(0, 10) + "T00:00:00");
  const md = (iso) => { const d = day(iso); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const mdw = (iso) => { const d = day(iso); return `${d.getMonth() + 1}/${d.getDate()}(${WD[(d.getDay() + 6) % 7]})`; };
  const ymd = (iso) => (R && iso.slice(0, 4) === R.today.slice(0, 4) ? md(iso) : `'${iso.slice(2, 4)} ${md(iso)}`);   // 올해는 월/일만
  const rng = (r) => `${md(r[0])}–${md(r[1])}`;
  const PRI = { high: "긴급", medium: "보통", low: "낮음" };
  const pdot = (p) => el("span", { class: `pd ${p}`, title: PRI[p] || p, "aria-label": PRI[p] || p });
  const KIND = { docx: "W", xlsx: "X" };
  const mailLink = (id, text, kind) => {
    const a = el("button", { class: "link", type: "button" }, KIND[kind] ? el("span", { class: `kd ${kind}`, text: KIND[kind], title: kind === "docx" ? "Word" : "Excel" }) : null, text);
    a.addEventListener("click", () => openMail(id));
    return a;
  };

  // ---- 설정·LLM ----
  $("me").value = store.get("mw-me") || "";
  $("me").addEventListener("change", () => store.set("mw-me", $("me").value.trim()));
  if (store.get("mw-weeks")) $("weeks").value = store.get("mw-weeks");
  $("weeks").addEventListener("change", () => store.set("mw-weeks", $("weeks").value));
  async function checkLlm() {
    $("llmDot").className = "dot";
    try {
      const r = await api("GET", "/api/check");
      $("llmDot").className = "dot " + (r.ok ? "ok" : "bad");
      $("llmText").textContent = r.ok ? "LLM" : "LLM 연결 안 됨";
      $("llm").title = r.message;
      if (!r.ok) $("err").textContent = "LLM: " + r.message;
    } catch (e) { $("llmDot").className = "dot bad"; $("llmText").textContent = "서버 오류"; }
  }
  $("llm").addEventListener("click", () => { $("err").textContent = ""; checkLlm(); });

  // ---- 메일 올리기 ----
  const files = new Map(), ignored = new Map();
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  drop.addEventListener("dragleave", (e) => { if (!drop.contains(e.relatedTarget)) drop.classList.remove("over"); });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());
  drop.addEventListener("drop", async (e) => {
    e.preventDefault(); drop.classList.remove("over");
    const entries = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    if (!entries.length) return upload([...e.dataTransfer.files].map((f) => [f, f.name]));
    const out = [];
    const walk = async (en, pre) => {
      if (en.isFile) out.push([await new Promise((ok, no) => en.file(ok, no)), pre + en.name]);
      else if (en.isDirectory) {
        const r = en.createReader();
        for (let b; (b = await new Promise((ok, no) => r.readEntries(ok, no))).length;) for (const c of b) await walk(c, pre + en.name + "/");
      }
    };
    for (const en of entries) await walk(en, "");
    upload(out);
  });
  $("pickFiles").addEventListener("click", () => $("fileIn").click());
  $("fileIn").addEventListener("change", (e) => { upload([...e.target.files].map((f) => [f, f.name])); e.target.value = ""; });

  async function upload(list) {
    const base = (n) => n.split("/").pop();
    for (const [, n] of list) {
      if (/^~\$/.test(base(n))) ignored.set(n, "Word·Excel 이 열려 있을 때 생기는 임시 파일 — 무시");
      else if (/\.hwpx?$/i.test(n)) ignored.set(n, "한글 문서는 읽지 못함 — 한글에서 .docx 로 저장해 올려 주세요");
      else if (!/\.(eml|docx|docm|xlsx|xlsm|doc|xls)$/i.test(n)) ignored.set(n, "지원하지 않는 형식 (.eml · .docx · .xlsx 만)");
    }
    const emls = list.filter(([, n]) => /\.(eml|docx|docm|xlsx|xlsm|doc|xls)$/i.test(n) && !/^~\$/.test(base(n)));
    const skipped = list.length - emls.length;
    if (!emls.length) { $("upText").textContent = skipped ? "올릴 수 있는 파일이 없습니다 (.eml · .docx · .xlsx)" : "끌어다 놓아도 됩니다"; return; }
    let done = 0;
    const tick = () => { $("upText").textContent = `올리는 중 ${done}/${emls.length}`; };
    tick();
    const queue = [...emls];
    const worker = async () => {
      for (let item; (item = queue.shift());) {
        const [f, name] = item;
        if (/\.(doc|xls)$/i.test(name)) { files.set(name, { name, status: "legacy" }); done++; tick(); continue; }   // 옛 형식은 올리지 않음
        try {
          const r = await api("POST", "/api/upload", f, { "X-File-Name": encodeURIComponent(name), "X-File-Modified": String(f.lastModified || ""),
            "Content-Type": "application/octet-stream" });
          files.set(r.id || name, r);
        } catch (e) { files.set(name, { name, status: "failed", reason: e.message }); }
        done++; tick();
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    renderFiles(skipped);
  }

  const WHY = { nodate: "날짜 없음", failed: "읽기 실패", legacy: ".doc/.xls → .docx/.xlsx 로 저장 필요" };
  function renderFiles(skipped = 0) {
    const all = [...files.values()];
    const ok = all.filter((f) => f.status === "ok").length;
    $("run").disabled = !ok;
    if (!all.length) { $("upText").textContent = "끌어다 놓아도 됩니다"; $("upText").title = ""; return; }
    const why = {};
    for (const f of all) if (f.status !== "ok") why[WHY[f.status] || "제외"] = (why[WHY[f.status] || "제외"] || 0) + 1;
    const ex = Object.entries(why).map(([k, n]) => `${k} ${n}`).join(", ");
    const clear = el("button", { class: "link", type: "button", text: "지우기" });
    clear.addEventListener("click", async () => { await api("POST", "/api/clear"); files.clear(); ignored.clear(); R = null; $("result").classList.add("hidden"); renderFiles(); });
    $("upText").replaceChildren(el("b", { class: "num", text: `${ok}` }), ` / ${all.length}개 · `, clear);
    $("upText").title = [`분석 가능 ${ok}`, ex && `제외: ${ex}`, skipped && `지원하지 않는 파일 ${skipped}개 무시`].filter(Boolean).join(" · ");
    renderSkipped();
  }

  // ---- 분석 안 된 파일 (올리기 단계 + 분석 단계) ----
  const SKIP = { failed: ["읽기 실패", "b-red"], legacy: ["옛 형식", "b-amber"], nodate: ["날짜 없음", "b-amber"],
                 range: ["기간 밖", "b-gray"], noise: ["자동 알림", "b-gray"], llm: ["분석 실패", "b-red"], ignored: ["무시", "b-gray"] };
  function renderSkipped() {
    const rows = new Map();
    for (const [n, why] of ignored) rows.set(n, { name: n, type: "ignored", why });
    for (const f of files.values()) if (f.status !== "ok") rows.set(f.id || f.name, { id: f.id, name: f.name, kind: f.kind, type: f.status,
      why: f.status === "legacy" ? "옛 형식 — Word·Excel 에서 .docx / .xlsx 로 저장해 다시 올려 주세요" : f.reason || WHY[f.status] });
    for (const x of (R && R.skipped) || []) rows.set(x.id, { id: x.id, name: x.type === "nodate" ? x.name : x.subject || x.name, kind: x.kind, type: x.type === "failed" ? "llm" : x.type, why: x.why });
    const list = [...rows.values()].sort((a, b) => Object.keys(SKIP).indexOf(a.type) - Object.keys(SKIP).indexOf(b.type));
    $("skipBox").classList.toggle("hidden", !list.length);
    $("skipN").textContent = String(list.length);
    $("skipList").replaceChildren(...list.map((x) => {
      const [label, cls] = SKIP[x.type] || ["제외", "b-gray"];
      return el("div", { class: "srow" }, el("span", { class: `badge ${cls}`, text: label }),
        x.id ? el("span", { class: "nm" }, mailLink(x.id, x.name, x.kind)) : el("span", { class: "nm", text: x.name, title: x.name }),
        el("span", { class: "why", text: x.why || "" }));
    }));
    if (list.some((x) => x.type === "failed" || x.type === "llm")) $("skipBox").open = true;
  }

  // ---- 분석 ----
  $("run").addEventListener("click", async () => {
    $("err").textContent = ""; $("run").disabled = true;
    const bar = $("runBar"); bar.classList.remove("hidden"); bar.firstElementChild.style.width = "3%";
    try {
      const { job } = await api("POST", "/api/analyze", JSON.stringify({ me: $("me").value.trim(), weeks: +$("weeks").value }), { "Content-Type": "application/json" });
      for (;;) {
        await new Promise((r) => setTimeout(r, 700));
        const s = await api("GET", `/api/jobs/${job}`);
        bar.firstElementChild.style.width = `${Math.max(3, (s.done / Math.max(1, s.total)) * 100)}%`;
        $("log").textContent = s.log[s.log.length - 1] || "분석 중…";
        if (s.state === "done") { $("log").textContent = ""; show(s.result); break; }
        if (s.state === "error") throw new Error(s.error);
      }
    } catch (e) { $("log").textContent = ""; $("err").textContent = e.message; }
    finally { $("run").disabled = false; setTimeout(() => bar.classList.add("hidden"), 500); }
  });

  // ---- 결과 ----
  const VIEWS = [["season", "작년 이맘때"], ["deadline", "기한 기준"]];
  const TABS = [["last", "지난 주"], ["this", "이번 주"], ["next", "다음 주"], ["month", "이번 달"], ["next_month", "다음 달"]];
  const MONTHLY = ["month", "next_month"];
  const SECS = [["last", "지난 주", ""], ["overdue", "기한 지남", "red"], ["today", "오늘", "red"], ["this", "이번 주", ""], ["next", "다음 주", ""], ["nodue", "기한 미정", ""]];
  const SUMS = [["plan", "이번 주"], ["next_plan", "다음 주"], ["month_plan", "이번 달"], ["next_month_plan", "다음 달"], ["weekly", "지난 주"]];
  const STATUS = {
    weekly: { done: ["완료", "b-green"], doing: ["진행", "b-gray"], todo: ["미확인", "b-red"] },
    plan: { urgent: ["급함", "b-red"], todo: ["이번 주", "b-gray"], ref: ["작년", "b-blue"] },
    next_plan: { prep: ["준비", "b-amber"], todo: ["다음 주", "b-gray"], ref: ["작년", "b-blue"] },
    month_plan: { urgent: ["급함", "b-red"], todo: ["이번 달", "b-gray"], ref: ["작년", "b-blue"] },
    next_month_plan: { prep: ["준비", "b-amber"], todo: ["다음 달", "b-gray"], ref: ["작년", "b-blue"] },
    season: { repeat: ["매년", "b-green"], check: ["확인", "b-gray"], prep: ["준비", "b-amber"] },
  };
  let R = null, shown = 50;
  let view = store.get("mw-view") || "season", tab = store.get("mw-tab") || "this", sumTab = store.get("mw-sum") || "plan";

  function show(r) {
    R = r; shown = 50;
    renderSkipped();
    $("result").classList.remove("hidden");
    renderView(); renderMails();
    $("views").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function renderView() {
    $("views").replaceChildren(...VIEWS.map(([k, label]) => {
      const b = el("button", { type: "button", role: "tab", "aria-selected": String(k === view), text: label });
      b.addEventListener("click", () => { view = k; store.set("mw-view", k); renderView(); });
      return b;
    }));
    view === "season" ? renderSeason() : renderDeadline();
  }

  function check(key, row, initial) {
    const cb = el("input", { type: "checkbox", "aria-label": "완료" });
    const saved = store.get(key);
    cb.checked = saved == null ? !!initial : saved === "1"; row.classList.toggle("done", cb.checked);
    cb.addEventListener("change", () => { store.set(key, cb.checked === !!initial ? null : cb.checked ? "1" : "0"); row.classList.toggle("done", cb.checked); });
    return cb;
  }

  // 요약 상자. head: 왼쪽 제목(문자열) 또는 탭 요소
  function sumBox(W, status, head, empty) {
    const copy = el("button", { class: "icon", type: "button", title: "복사", "aria-label": "복사", text: "복사" });
    copy.disabled = !W;
    copy.addEventListener("click", async () => {
      const text = [W.summary, ...W.items.map((i) => `- ${i.topic ? `[${i.topic}] ` : ""}${i.text} (${status[i.status][0]})`)].filter(Boolean).join("\n");
      try { await navigator.clipboard.writeText(text); }
      catch { const ta = el("textarea"); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
      copy.textContent = "✓"; setTimeout(() => (copy.textContent = "복사"), 1200);
    });
    const body = !W ? [el("div", { class: "empty", text: empty })] : [
      W.summary ? el("p", { text: W.summary }) : null,
      el("ul", {}, ...W.items.map((i) => {
        const [label, cls] = status[i.status];
        return el("li", {}, el("span", { class: `badge ${cls}`, text: label }), el("span", {}, i.topic ? el("b", { text: i.topic + " " }) : null, i.text),
          i.mails.length ? el("span", { class: "src" }, mailLink(i.mails[0], i.mails.length > 1 ? `원문 ${i.mails.length}` : "원문")) : null);
      })),
    ];
    return el("div", { class: "sum" }, el("div", { class: "sum-h" }, typeof head === "string" ? el("span", { class: "ttl", text: head }) : head, copy), ...body);
  }

  function tile(label, sub, n, selected, tone, onClick) {
    const t = el("button", { class: `tile ${n ? tone : "zero"}`, type: "button" },
      el("div", { class: "k" }, el("span", { text: label }), sub ? el("small", { text: sub }) : null), el("div", { class: "v num", text: String(n) }));
    if (selected != null) t.setAttribute("aria-selected", String(selected));
    t.addEventListener("click", onClick);
    return t;
  }

  // ---- 작년 이맘때 ----
  function renderSeason() {
    const S = R.season;
    if (!S.periods[tab]) tab = "this";
    $("tiles").className = "tiles";
    $("tiles").replaceChildren(...TABS.map(([k, label]) => tile(label, MONTHLY.includes(k) ? S.periods[k].label : S.periods[k].label.split(" · ").pop(),
      S.buckets[k].items.length, k === tab, "", () => { tab = k; store.set("mw-tab", k); renderSeason(); })));
    const p = S.periods[tab], b = S.buckets[tab];
    const blocks = R.warnings.map((w) => el("div", { class: "note err", text: w }));
    if (b.items.length) blocks.push(sumBox((S.summaries || {})[tab], STATUS.season, `작년 ${p.label} → 올해`, "요약 없음"));
    if (!b.items.length) blocks.push(el("div", { class: "empty", style: "padding:16px 0", text: S.used ? `작년 ${p.label}에 찾은 일이 없습니다` : `지난해 ${S.periods.month.label} 메일을 올려 주세요` }));
    let wk = null;
    for (const t of b.items) {
      if (MONTHLY.includes(tab) && t.week !== wk) {
        wk = t.week;
        const now = ["last", "this", "next"].find((k) => S.periods[k].keys.some(([mo, w]) => mo === p.month && w === wk));
        blocks.push(el("div", { class: "grp" }, `${wk}주차`, now ? el("span", { class: "c", text: TABS.find(([k]) => k === now)[1] }) : null));
      } else if (!MONTHLY.includes(tab) && t === b.items[0]) blocks.push(el("div", { class: "grp" }, "작년 이맘때 한 일", el("span", { class: "c num", text: String(b.items.length) })));
      const row = el("div", { class: "row" });
      const x = t.sources[0];
      put(row, check(`mw-done:${R.today.slice(0, 4)}:${t.title}`, row), pdot(t.priority),
        el("div", { class: "main" }, el("div", { class: "tt" }, t.title, t.years.length > 1 ? el("span", { class: "badge b-green", style: "margin-left:6px", text: "매년" }) : null),
          el("div", { class: "meta" }, `${ymd(x.date)} · `, mailLink(x.mail, x.subject, x.kind), t.sources.length > 1 ? ` 외 ${t.sources.length - 1}` : "")));
      blocks.push(row);
    }
    if (b.others.length) blocks.push(el("details", { class: "more" }, el("summary", { text: `기타 메일 ${b.others.length}` }),
      ...b.others.map((m) => el("div", { class: "row" }, el("div", { class: "main" }, el("div", {}, mailLink(m.mail, m.subject, m.kind)),
        el("div", { class: "meta", text: `${ymd(m.date)}${m.summary ? " · " + m.summary : ""}` }))))));
    $("tasks").replaceChildren(...blocks);
  }

  // ---- 기한 기준 ----
  function renderDeadline() {
    const D = R.deadline;
    $("tiles").className = "tiles six";
    $("tiles").replaceChildren(...SECS.map(([k, label, tone]) => tile(label, null, D.buckets[k].length, null, tone,
      () => document.getElementById("sec-" + k)?.scrollIntoView({ behavior: "smooth", block: "center" }))));
    const blocks = R.warnings.map((w) => el("div", { class: "note err", text: w }));
    if (!SUMS.some(([k]) => k === sumTab)) sumTab = "plan";
    const tabs = el("div", { class: "tabs", role: "tablist" }, ...SUMS.map(([k, label]) => {
      const b = el("button", { type: "button", role: "tab", "aria-selected": String(k === sumTab), text: label });
      b.addEventListener("click", () => { sumTab = k; store.set("mw-sum", k); renderDeadline(); });
      return b;
    }));
    blocks.push(sumBox(D[sumTab], STATUS[sumTab], tabs, "요약할 일이 없습니다"));
    const ranges = { last: D.last_week, this: D.this_week, next: D.next_week };
    for (const [k, label] of SECS) {
      const items = D.buckets[k];
      if (!items.length) continue;
      blocks.push(el("div", { class: "grp", id: "sec-" + k }, label, el("span", { class: "c num", text: String(items.length) }),
        ranges[k] ? el("span", { class: "r num", text: rng(ranges[k]) }) : null));
      for (const t of items) {
        const row = el("div", { class: "row" });
        const late = !t.done && t.due && t.due < R.today;
        const st = k !== "last" ? null : t.done ? el("span", { class: "badge b-green", text: "완료" }) : late ? el("span", { class: "badge b-red", text: "미확인" }) : null;
        put(row, check("mw-done:" + t.title + "|" + (t.due || ""), row, t.done), pdot(t.priority),
          el("div", { class: "main" }, el("div", { class: "tt", text: t.title }), el("div", { class: "meta" }, `${ymd(t.received)} · `, mailLink(t.mail, t.subject, t.kind))),
          st, t.due ? el("span", { class: `when num ${late && k !== "last" ? "late" : ""}`, text: mdw(t.due) }) : null);
        blocks.push(row);
      }
    }
    if (!SECS.some(([k]) => D.buckets[k].length)) blocks.push(el("div", { class: "empty", style: "padding:12px 0", text: `최근 ${R.stats.weeks}주 메일에 할 일이 없습니다` }));
    $("tasks").replaceChildren(...blocks);
  }

  // ---- 메일 목록 ----
  function renderMails() {
    if (!R) return;
    const q = $("q").value.trim().toLowerCase(), act = $("onlyAct").checked;
    const list = R.mails.filter((m) => (!act || m.tasks) && (!q || [m.subject, m.sender, m.summary, ...m.keywords].join(" ").toLowerCase().includes(q)));
    $("mcount").textContent = String(list.length);
    $("mails").replaceChildren(...list.slice(0, shown).map((m) => {
      const kws = m.keywords.map((k) => { const b = el("button", { class: "kw", type: "button", text: "#" + k }); b.addEventListener("click", () => { $("q").value = k; shown = 50; renderMails(); }); return b; });
      return el("div", { class: "mrow" }, el("span", { class: "d num", text: ymd(m.date) }),
        el("div", { style: "min-width:0" }, el("div", {}, mailLink(m.id, m.subject, m.kind),
          m.same ? el("span", { class: "badge b-blue", style: "margin-left:6px", text: "작년" }) : null,
          m.noise ? el("span", { class: "badge b-gray", style: "margin-left:6px", text: "알림" }) : null,
          m.failed ? el("span", { class: "badge b-red", style: "margin-left:6px", text: "분석 실패", title: m.failed }) : null),
          (m.summary || kws.length) ? el("div", { class: "s" }, ...kws, m.summary || "") : null));
    }));
    $("more").classList.toggle("hidden", list.length <= shown);
  }
  let qt; $("q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(() => { shown = 50; renderMails(); }, 200); });
  $("onlyAct").addEventListener("change", () => { shown = 50; renderMails(); });
  $("more").addEventListener("click", () => { shown += 50; renderMails(); });
  $("clearCache").addEventListener("click", async () => { if (confirm("저장된 분석 결과를 지울까요?")) { await api("POST", "/api/cache/clear"); alert("지웠습니다."); } });

  // ---- 원문 ----
  async function openMail(id) {
    const d = $("dlg"); $("dvTitle").textContent = "불러오는 중…"; $("dvMeta").replaceChildren(); $("dvBody").textContent = "";
    if (!d.open) d.showModal();
    try {
      const m = await api("GET", `/api/mails/${id}`);
      $("dvTitle").textContent = m.subject;
      const doc = m.kind === "docx" || m.kind === "xlsx";
      const rows = (doc ? [["문서", m.kind === "docx" ? "Word" : "Excel"], ["작성자", m.sender], ["수정일", m.date], ["파일", m.name]]
        : [["보낸 사람", m.sender], ["받는 사람", m.to], ["참조", m.cc], ["날짜", m.date], ["첨부", (m.attachments || []).join(", ")]]).filter(([, v]) => v);
      $("dvMeta").replaceChildren(...rows.flatMap(([k, v]) => [el("dt", { text: k }), el("dd", { text: v })]));
      $("dvBody").textContent = m.body || "(본문 없음)";
    } catch (e) { $("dvTitle").textContent = "원문을 불러오지 못했습니다"; $("dvBody").textContent = e.message + "\n(서버를 다시 시작했다면 메일을 다시 올려 주세요)"; }
  }
  $("dlgClose").addEventListener("click", () => $("dlg").close());
  $("dlg").addEventListener("click", (e) => { if (e.target === $("dlg")) $("dlg").close(); });

  checkLlm();
})();
</script>
</body>
</html>
